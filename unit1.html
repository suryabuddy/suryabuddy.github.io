<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 1 - Computer Se Parichay</title>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
.header{background:#cc0000;color:white;padding:12px;text-align:center;font-weight:800;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.header a{color:white;text-decoration:none;background:#a00000;padding:6px 12px;border-radius:6px}
.container{max-width:900px;margin:0 auto;background:white;min-height:100vh}
.lock-box{padding:60px 20px;text-align:center}
.lock-box input{padding:14px;width:85%;max-width:300px;border:2px solid #cc0000;border-radius:8px;margin:15px 0;font-size:16px}
.lock-box button{padding:14px 35px;background:#cc0000;color:white;border:none;border-radius:8px;font-weight:700;font-size:16px;cursor:pointer}
.content{display:none;padding:0}
.content.active{display:block}
.page-img{width:100%;display:block;border-bottom:2px solid #eee}
h1{color:#cc0000;text-align:center;padding:20px 10px 0 10px}
</style>
</head>
<body>
<div class="header"><a href="index.html">← HOME</a><span>UNIT 1</span><span></span></div>
<div class="container">
<div id="lockScreen" class="lock-box">
<h2 style="color:#cc0000">🔒 Unit 1 Locked Hai</h2>
<p>Password: <b>surya1999</b></p>
<input type="password" id="passInput" placeholder="Password likho">
<br><button onclick="checkPass()">Unlock Karo 🔓</button>
<p id="err" style="color:red;margin-top:15px"></p>
</div>
<div id="mainContent" class="content">
<h1>अध्याय - 1. कंप्यूटर से परिचय</h1>
<img src="unit1_page_1.png" class="page-img">
<img src="unit1_page_2.png" class="page-img">
<img src="unit1_page_3.png" class="page-img">
<img src="unit1_page_4.png" class="page-img">
<img src="unit1_page_5.png" class="page-img">
<img src="unit1_page_6.png" class="page-img">
<img src="unit1_page_7.png" class="page-img">
<img src="unit1_page_8.png" class="page-img">
<p style="text-align:center;padding:20px"><a href="index.html" style="background:#cc0000;color:white;padding:12px 25px;border-radius:8px;text-decoration:none;font-weight:700">← Home Jao</a></p>
</div>
</div>
<script>
function checkPass(){
 if(document.getElementById("passInput").value=="surya1999"){
  document.getElementById("lockScreen").style.display="none";
  document.getElementById("mainContent").classList.add("active");
  let arr=JSON.parse(localStorage.getItem("unlockedUnits")||"[]");
  if(!arr.includes(1)){arr.push(1);localStorage.setItem("unlockedUnits",JSON.stringify(arr))}
 } else {document.getElementById("err").innerText="Galat Password! surya1999 likho"}
}
window.onload=function(){
 let arr=JSON.parse(localStorage.getItem("unlockedUnits")||"[]");
 if(arr.includes(1)){document.getElementById("lockScreen").style.display="none";document.getElementById("mainContent").classList.add("active")}
}
</script>
</body>
</html>
